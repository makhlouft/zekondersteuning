name: HTML Lint

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tidy
        run: sudo apt-get update && sudo apt-get install -y tidy
      - name: Run HTML lint
        run: bash tests/lint_html.sh
